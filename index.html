// V0.9: declarative snapshot rules, no recursive triggers.
function laws(l,a){
 const facts={frozen:a.f,ghost:a.p,pressed:openDoor(l,a),touching:a.boxes.some(([x,y])=>Math.abs(x-a.x)+Math.abs(y-a.y)===1)};

   out[r.effect]=r.value; priorities[r.effect]=r.priority;
  }
 }
 return out;
}
function validateLaws(rs){
 if(!Array.isArray(rs)||rs.length>8)throw Error('最多八条规则');

 for(const r of rs){
  if(!r||!['frozen','ghost','pressed','touching'].includes(r.when)||!['phase','reverse'].includes(r.effect)||typeof r.value!=='boolean'||!Number.isInteger(r.priority)||r.priority<0||r.priority>9)throw Error('非法规则');

  if(seen.has(k))throw Error('同一效果不可使用相同优先级');
  seen.add(k);
 }
 return rs.map(r=>({...r}));
}

);

);
function describeLaw(r){return ({frozen:'冻结',ghost:'虚体',pressed:'开关激活',touching:'紧邻箱体'})[r.when]+' → '+(r.effect==='phase'?(r.value?'允许穿透':'禁止穿透'):(r.value?'重力反转':'重力正常'))+'（优先级 '+r.priority+'）'}
function tile(l,x,y){return l.map[y]?.[x]??'#'}
function gravity(l,a){let k='v<^>'.indexOf(tile(l,a.x,a.y));let g=k<0?a.g:k;return laws(l,a).reverse?(g+2)%4:g}
function openDoor(l,a){return a.boxes.some(([x,y])=>tile(l,x,y)==='T')}
function terrain(l,a,x,y){let t=tile(l,x,y);return t==='#'||(t==='P'&&!(laws(l,a).phase??a.p))||(t==='H'&&!openDoor(l,a))}
function boxTerrain(l,a,x,y){let t=tile(l,x,y);return t==='#'||t==='P'||(t==='H'&&!openDoor(l,a))}
function validState(l,a){return a!==null&&!terrain(l,a,a.x,a.y)&&!a.boxes.some(([x,y])=>boxTerrain(l,a,x,y))}
function boxAt(a,x,y){return a.boxes.findIndex(b=>b[0]===x&&b[1]===y)}
function blocked(l,a,x,y){return terrain(l,a,x,y)||boxAt(a,x,y)>=0}
function won(l,a){return tile(l,a.x,a.y)==='G'&&(!l.solidGoal||!a.p)}
function settle(l,a){a={...a};if(!validState(l,a))return null;if(a.f)return a;let seen=new Set();while(!won(l,a)){let k=a.x+','+a.y;if(seen.has(k))return null;seen.add(k);let [dx,dy]=D[gravity(l,a)];if(blocked(l,a,a.x+dx,a.y+dy))break;a.x+=dx;a.y+=dy;if(!validState(l,a))return null}return a}
function initial(l){let y=l.map.findIndex(r=>r.includes('S')),boxes=[];l.map.forEach((r,y)=>[...r].forEach((t,x)=>{if(t==='B')boxes.push([x,y])}));return settle(l,{x:l.map[y].indexOf('S'),y,g:0,p:false,f:false,b:l.budget,boxes})}
const A=[...D.map((_,m)=>({m})),...D.map((_,g)=>({g})),{p:true},{f:true}];
function step(l,a,t){if(won(l,a))return null;if('m'in t){let [dx,dy]=D[t.m],[gx,gy]=D[gravity(l,a)],x=a.x+dx,y=a.y+dy;if((!a.f&&dx*gx+dy*gy!==0)||terrain(l,a,x,y))return null;let boxes=a.boxes, j=boxAt(a,x,y);if(j>=0){let bx=x+dx,by=y+dy;if(boxTerrain(l,a,bx,by)||boxAt(a,bx,by)>=0)return null;boxes=boxes.map((b,k)=>k===j?[bx,by]:b);let next={...a,boxes};if(terrain(l,next,x,y)||boxes.some(([u,v])=>boxTerrain(l,next,u,v)))return null}return settle(l,{...a,boxes,x,y})}let k=Object.keys(t)[0];if(!l.allow.includes(k)||!a.b)return null;if(k==='g'&&a.g===t.g)return null;return settle(l,{...a,[k]:k==='g'?t.g:!a[k],b:a.b-1})}
function key(a){return [a.x,a.y,a.g,+a.p,+a.f,a.b,a.boxes.map(b=>b.join(':')).sort().join(';')].join(',')}
function solve(l,start){if(!start)return null;let q=[{a:start,path:[]}],seen=new Set([key(start)]);for(let j=0;j<q.length;j++){let {a,path}=q[j];if(won(l,a))return path;for(let t of A){let b=step(l,a,t);if(b&&!seen.has(key(b))){seen.add(key(b));q.push({a:b,path:[...path,t]})}}}return null}

function rng(seed){return ()=>{seed=(Math.imul(seed,1664525)+1013904223)>>>0;return seed/4294967296}}
function generate(seed,limit=180){let r=rng(seed);for(let attempt=1;attempt<=limit;attempt++){let map=Array.from({length:6},(_,y)=>Array.from({length:10},(_,x)=>y===0||y===5||x===0||x===9?'#':'.'));let wall=3+Math.floor(r()*4);for(let y=1;y<5;y++)map[y][wall]='P';for(let y=1;y<5;y++)for(let x=1;x<9;x++)if(map[y][x]==='.'&&r()<.16)map[y][x]='#';map[4][1]='S';map[1+Math.floor(r()*2)][8]='G';let l={name:'生成谜题 · '+seed,desc:'在有限预算内寻找跨越障碍的法则组合。',map:map.map(row=>row.join('')),budget:2,allow:['p','f','g']};let a=initial(l),path=solve(l,a);if(!path||path.length<8)continue;let required=l.allow.filter(k=>{let v={...l,allow:l.allow.filter(t=>t!==k)};return solve(v,initial(v))===null});if(required.length<2)continue;let traps=A.filter(t=>{let b=step(l,a,t);return b&&solve(l,b)===null}).length;if(!traps)continue;l.metrics={steps:path.length,required,traps,attempt,seed};return l}return null}
// Fitness evaluates a shortest-path DAG and all reachable losing states.
function evaluate(l){const start=initial(l);if(!start)return null;const states=[start], ids=new Map([[key(start),0]]), edges=[], dist=[0], ways=[1], goals=[];for(let j=0;j<states.length;j++){let a=states[j];edges[j]=[];if(won(l,a)){goals.push(j);continue}for(let t of A){let b=step(l,a,t);if(!b)continue;let k=key(b),v=ids.get(k);if(v===undefined){v=states.length;ids.set(k,v);states.push(b);dist[v]=dist[j]+1;ways[v]=0}edges[j].push(v);if(dist[v]===dist[j]+1)ways[v]=Math.min(1e9,ways[v]+ways[j]);}}if(!goals.length)return null;let steps=Math.min(...goals.map(j=>dist[j]));if(steps<8)return null;let required=l.allow.filter(k=>{let v={...l,allow:l.allow.filter(t=>t!==k)};return solve(v,initial(v))===null});if(required.length<2)return null;let rev=states.map(()=>[]);edges.forEach((es,j)=>es.forEach(v=>rev[v].push(j)));let live=new Set(goals),q=[...goals];for(let j=0;j<q.length;j++)for(let v of rev[q[j]])if(!live.has(v)){live.add(v);q.push(v)}let traps=edges[0].filter(v=>!live.has(v)).length, losing=(states.length-live.size)/states.length, paths=goals.filter(j=>dist[j]===steps).reduce((a,j)=>a+ways[j],0);if(!traps)return null;let score=steps+4*required.length+2*Math.log2(1+paths)+4*(1-Math.abs(losing-.35));return {steps,required,traps,losing,paths,score,states:states.length}}
function evolve(seed,rounds=10,popSize=6){let r=rng(seed),pool=[],evaluations=0;function add(l){evaluations++;let m=evaluate(l);if(m)pool.push({...l,metrics:m})}for(let j=0;j<popSize;j++){let l=generate((r()*4294967296)>>>0);if(l)add(l)}if(!pool.length)return null;pool.sort((a,b)=>b.metrics.score-a.metrics.score);let baseline=pool[0].metrics.score;for(let gen=0;gen<rounds;gen++){let parents=pool.slice(0,popSize);for(let j=0;j<popSize;j++){let a=parents[Math.floor(r()*parents.length)],b=parents[Math.floor(r()*parents.length)],map=a.map.map(x=>x.split(''));let cut=2+Math.floor(r()*6);for(let y=1;y<5;y++)for(let x=cut;x<9;x++)if(!'SG'.includes(map[y][x])&&!'SG'.includes(b.map[y][x]))map[y][x]=b.map[y][x];for(let k=0;k<2;k++){let x=1+Math.floor(r()*8),y=1+Math.floor(r()*4);if(!'SG'.includes(map[y][x]))map[y][x]=['.','#','P'][Math.floor(r()*3)]}add({...a,map:map.map(x=>x.join(''))})}pool.sort((a,b)=>b.metrics.score-a.metrics.score);let seen=new Set();pool=pool.filter(l=>{let k=l.map.join('');if(seen.has(k))return false;seen.add(k);return true}).slice(0,popSize)}let best=pool[0];return {...best,name:'进化谜题 · '+seed,desc:'进化搜索：保留优秀关卡，交叉和变异地形。',metrics:{...best.metrics,seed,baseline,evaluations}}}
// V0.19: compositional mechanism grammar with solver-backed ablation.
const GRAMMAR_FAMILIES=['phase-gate','frozen-gate','gravity-shaft','ghost-reversal','switch-phase'];
function grammarBlank(){return Array.from({length:6},(_,y)=>Array.from({length:10},(_,x)=>x===0||x===9||y===0||y===5?'#':'.'))}
function grammarBuild(kind,seed){
 const map=grammarBlank(),put=(x,y,t)=>{map[y][x]=t},wall=3+(seed%4),startX=1+((seed>>>2)%(wall-1)),goalX=wall+1+((seed>>>5)%(8-wall));let budget=0,allow=[],laws=[],solidGoal=false;
 if(kind==='phase-gate'){for(let y=1;y<=4;y++)put(wall,y,'P');put(startX,4,'S');put(goalX,4,'G');budget=2;allow=['p'];solidGoal=true}
 else if(kind==='frozen-gate'){for(let y=1;y<=4;y++)put(wall,y,'P');put(startX,4,'S');put(goalX,4,'G');budget=1;allow=['f'];laws=[{when:'frozen',effect:'phase',value:true,priority:1}]}
 else if(kind==='gravity-shaft'){for(let y=2;y<=4;y++)put(wall,y,'#');put(startX,4,'S');put(goalX,4,'G');budget=2;allow=['g']}
 else if(kind==='ghost-reversal'){for(let y=2;y<=4;y++)put(wall,y,'#');put(startX,4,'S');put(goalX,4,'G');budget=2;allow=['p'];solidGoal=true;laws=[{when:'ghost',effect:'reverse',value:true,priority:1}]}
 else if(kind==='switch-phase'){const boxX=2+(seed&1),tx=boxX+1+((seed>>>1)%(6-boxX)),gx=tx+2+((seed>>>5)%(7-tx));for(let x=tx;x<=8;x++)put(x,2,'#');for(let x=tx+1;x<=8;x++)put(x,4,'#');put(1,4,'S');put(boxX,4,'B');put(tx,4,'T');put(tx,3,'H');put(tx+1,3,'P');put(gx,3,'G');budget=2;allow=['f','p']}
 else throw Error('unknown grammar production');
 return {kind,level:{name:'语法谜题',desc:'组合式机制语法生成。',map:map.map(r=>r.join('')),budget,allow,solidGoal,laws}};
}
function grammarAnalyze(l,kind){
 const start=initial(l);if(!start)return null;const states=[start],ids=new Map([[key(start),0]]),edges=[],dist=[0],ways=[1],goals=[];
 for(let i=0;i<states.length;i++){if(states.length>12000)return null;const a=states[i];edges[i]=[];if(won(l,a)){goals.push(i);continue}for(const action of A){const b=step(l,a,action);if(!b)continue;const k=key(b);let j=ids.get(k);if(j===undefined){j=states.length;ids.set(k,j);states.push(b);dist[j]=dist[i]+1;ways[j]=0}edges[i].push(j);if(dist[j]===dist[i]+1)ways[j]=Math.min(1e9,ways[j]+ways[i])}}
 if(!goals.length)return null;const steps=Math.min(...goals.map(i=>dist[i])),paths=goals.filter(i=>dist[i]===steps).reduce((n,i)=>Math.min(1e9,n+ways[i]),0);
 const rev=states.map(()=>[]);edges.forEach((es,i)=>es.forEach(j=>rev[j].push(i)));const live=new Set(goals),q=[...goals];for(let i=0;i<q.length;i++)for(const j of rev[q[i]])if(!live.has(j)){live.add(j);q.push(j)}
 const traps=edges[0].filter(j=>!live.has(j)).length,required=l.allow.filter(k=>{const v={...l,allow:l.allow.filter(x=>x!==k)};return solve(v,initial(v))===null});if(required.length!==l.allow.length)return null;
 const lawRequired=(l.laws||[]).every((_,i)=>{const v={...l,laws:l.laws.filter((_,j)=>j!==i)};return solve(v,initial(v))===null});if(!lawRequired)return null;
 if(kind==='switch-phase')for(const symbol of ['B','T']){const v={...l,map:l.map.map(row=>row.replace(symbol,'.'))};if(solve(v,initial(v))!==null)return null}
 const path=solve(l,start);let pushes=0,rewrites=0,a=start;for(const action of path){const b=step(l,a,action);if(!b)return null;if('m'in action){if(JSON.stringify(a.boxes)!==JSON.stringify(b.boxes))pushes++}else rewrites++;a=b}
 if(!won(l,a)||steps<(kind==='switch-phase'?7:kind==='frozen-gate'?3:4))return null;
 const mechanisms=({'phase-gate':['相位穿透','实体恢复'],'frozen-gate':['条件法则','时间冻结'],'gravity-shaft':['全局重力反转','垂直通道'],'ghost-reversal':['虚体触发重力反转','实体恢复'],'switch-phase':['箱体压板','门控','时间冻结','相位穿透']})[kind];
 return {steps,required,lawCount:(l.laws||[]).length,traps,paths,states:states.length,pushes,rewrites,mechanisms,grammar:kind};
}
function generateGrammarPuzzle(seed,limit=48,targetRule=null){
 if(!Number.isInteger(seed)||!Number.isInteger(limit)||limit<1||limit>500||targetRule!==null&&!['g','p','f'].includes(targetRule))throw Error('invalid grammar search settings');
 const r=rng(seed),pool=[],seen=new Set();
 for(let i=0;i<limit;i++){const kind=GRAMMAR_FAMILIES[(i+(seed>>>0)%GRAMMAR_FAMILIES.length)%GRAMMAR_FAMILIES.length],variant=(r()*4294967296)>>>0,c=grammarBuild(kind,variant),m=grammarAnalyze(c.level,kind);if(!m||targetRule&&!m.required.includes(targetRule))continue;const sig=c.level.map.join('')+'|'+c.level.allow.join('')+'|'+JSON.stringify(c.level.laws);if(seen.has(sig))continue;seen.add(sig);pool.push({...c.level,name:'语法谜题 · '+kind,desc:'组合式机制语法生成；核心法则和关键机关均通过消融验证。',metrics:{...m,seed,evaluations:i+1}})}
 if(!pool.length)return null;const available=GRAMMAR_FAMILIES.filter(kind=>pool.some(c=>c.metrics.grammar===kind));const family=available[Math.floor(r()*available.length)],choices=pool.filter(c=>c.metrics.grammar===family),chosen=choices[Math.floor(r()*choices.length)];chosen.metrics.validCandidates=pool.length;chosen.metrics.validFamilies=available.length;return chosen;
}
function generateUI(){let seed=(Math.random()*4294967296)>>>0;let l=generateGrammarPuzzle(seed,64);if(!l){document.getElementById('msg').textContent='本次语法搜索未找到通过消融验证的谜题，请重试。';return}L.push(l);let sel=document.getElementById('levels');sel.add(new Option(l.name,L.length-1));i=L.length-1;reset()}


const fresh=()=>({g:{a:2,b:2},p:{a:2,b:2},f:{a:2,b:2},n:0});
let profile=fresh();try{const v=JSON.parse(localStorage.getItem('lawless05'));if(v&&['g','p','f'].every(k=>Number.isFinite(v[k]?.a)&&v[k].a>=2&&Number.isFinite(v[k]?.b)&&v[k].b>=2)&&Number.isInteger(v.n)&&v.n>=0)profile=v}catch(e){}
const mastery=(p,k)=>p[k].a/(p[k].a+p[k].b);
function requiredRules(l){return l.allow.filter(k=>{let v={...l,allow:l.allow.filter(t=>t!==k)};return solve(v,initial(v))===null})}
function updateProfile(p,l,t){let optimal=solve(l,initial(l));if(!optimal||!t.won)return p;let quality=Math.min(1,optimal.length/Math.max(1,t.moves+t.undos+2*t.hints+3*t.resets));for(let k of requiredRules(l)){p[k].a+=quality;p[k].b+=1-quality}p.n++;return p}
function target(p){return ['g','p','f'].sort((a,b)=>mastery(p,a)-mastery(p,b))[0]}
function recommend(p,seed){let k=target(p),m=mastery(p,k),candidates=[];for(let j=0;j<4;j++){let l=generateGrammarPuzzle((seed+j)>>>0,48,k);if(l)candidates.push(l)}if(candidates.length){let wanted=8+Math.round(4*m);candidates.sort((a,b)=>Math.abs(a.metrics.steps-wanted)-Math.abs(b.metrics.steps-wanted)||b.metrics.states-a.metrics.states);return {...candidates[0],name:'专项训练 · '+({g:'重力',p:'物质',f:'时间'}[k])+' / '+candidates[0].metrics.grammar}}return {...L[['g','p','f'].indexOf(k)],name:'专项训练 · '+({g:'重力',p:'物质',f:'时间'}[k])}}
function persist(){try{localStorage.setItem('lawless05',JSON.stringify(profile))}catch(e){}}
function clearProfile(){profile=fresh();persist();draw()}
function adaptiveUI(){let l=recommend(profile,(Math.random()*4294967296)>>>0);L.push(l);document.getElementById('levels').add(new Option(l.name,L.length-1));i=L.length-1;reset()}
let telemetry={moves:0,undos:0,hints:0,resets:0,won:false};
function showProfile(){document.getElementById('profile').textContent='能力估计（非实测准确率） · '+['g','p','f'].map(k=>({g:'重力',p:'物质',f:'时间'}[k])+': '+Math.round(mastery(profile,k)*100)+'%').join(' / ')+' · 完成记录 '+profile.n}


function validateLevel(l){if(!l||!Array.isArray(l.map)||l.map.length!==6||l.map.some(r=>typeof r!=="string"||!/^[.#PSGBTHv<^>]{10}$/.test(r)))throw Error('地图必须为 10×6 合法字符');if(l.map.some((r,y)=>[...r].some((t,x)=>(y===0||y===5||x===0||x===9)&&t!== '#')))throw Error('边界必须为绝对墙');for(const t of ['S','G'])if([...l.map.join('')].filter(c=>c===t).length!==1)throw Error('起点与出口必须各有一个');if((l.map.join('').match(/B/g)||[]).length>2)throw Error('最多两个能量箱');if(!Number.isInteger(l.budget)||l.budget<0||l.budget>8)throw Error('预算须为 0–8 的整数');if(!Array.isArray(l.allow)||l.allow.some(k=>!['g','p','f'].includes(k))||new Set(l.allow).size!==l.allow.length)throw Error('非法法则配置');if(typeof l.solidGoal!== 'boolean')throw Error('非法出口条件');return {name:'自制关卡',desc:'来自世界编辑器',map:[...l.map],budget:l.budget,allow:[...l.allow],solidGoal:l.solidGoal,laws:validateLaws(l.laws??[]),custom:true}}
let em,editorLaws=[];const el=id=>document.getElementById(id);function editorLoad(l){editorLaws=validateLaws(l.laws??[]);el('rulejson').value=JSON.stringify(editorLaws);em=l.map.map(r=>[...r]);el('eb').value=l.budget;for(const k of ['g','p','f'])el('e'+k).checked=l.allow.includes(k);el('es').checked=!!l.solidGoal;editorDraw();el('eres').textContent='已载入地图'}function editorDraw(){el('editgrid').replaceChildren(...em.flatMap((row,y)=>row.map((t,x)=>{let b=document.createElement('button');b.textContent=t==='.'?'·':t;b.style.background=({'#':'#465168',P:'#784eb0',G:'#258871',S:'#6657c8'})[t]||'#1c2534';b.disabled=x===0||x===9||y===0||y===5;b.setAttribute('aria-label',`格子 ${x},${y} ${t}`);b.onclick=()=>{let v=el('brush').value;if('SG'.includes(v))for(let r of em)for(let j=0;j<r.length;j++)if(r[j]===v)r[j]='.';em[y][x]=v;editorDraw();el('eres').textContent='地图已修改，请重新验证'};return b}))) }function editorRead(){return validateLevel({map:em.map(r=>r.join('')),budget:Number(el('eb').value),allow:['g','p','f'].filter(k=>el('e'+k).checked),solidGoal:el('es').checked,laws:JSON.parse(el('rulejson').value)})}function editorAction(fn){try{fn()}catch(e){el('eres').textContent=e.message}}function editorCheck(){editorAction(()=>{let l=editorRead(),p=solve(l,initial(l));el('eres').textContent=p===null?'无解，可继续编辑':`有解 · 最短 ${p.length} 步 · 必需法则：${requiredRules(l).map(k=>({g:'重力',p:'物质',f:'时间'}[k])).join('、')||'无'}`})}function editorPlay(){editorAction(()=>{let l=editorRead();if(solve(l,initial(l))===null)throw Error('当前关卡无解，请先调整');L.push(l);el('levels').add(new Option(l.name,L.length-1));i=L.length-1;reset();el('eres').textContent='已进入试玩'})}function editorExport(){editorAction(()=>{el('edata').value=JSON.stringify(editorRead(),null,2);el('eres').textContent='已生成 JSON，可复制分享'})}function editorImport(){editorAction(()=>editorLoad(validateLevel(JSON.parse(el('edata').value))))}

let i=0,s,h=[],lastLevel=-1;function apply(t){let b=step(L[i],s,t);if(b){h.push(s);s=b;telemetry.moves++;if(won(L[i],s)&&!telemetry.won){telemetry.won=true;if(!L[i].custom){updateProfile(profile,L[i],telemetry);persist()}}draw()}}function reset(){if(lastLevel!==i){telemetry={moves:0,undos:0,hints:0,resets:0,won:false};lastLevel=i}else if(!telemetry.won)telemetry.resets++;s=initial(L[i]);h=[];draw()}function undo(){if(h.length){s=h.pop();telemetry.undos++;draw()}}function next(){if(won(L[i],s)&&i<L.length-1){i++;reset()}}function label(t){return 'm'in t?'移动 '+N[t.m]:'g'in t?'重力 '+N[t.g]:'p'in t?'切换物质':'切换冻结'}function hint(){telemetry.hints++;let p=solve(L[i],s);document.getElementById('msg').textContent=p===null?'当前状态无解，请撤销或重置。':p.length?'最短剩余 '+p.length+' 步：'+label(p[0]):'已通关'}let visual=null, frame=0;const reduced=typeof matchMedia!=='undefined'&&matchMedia('(prefers-reduced-motion: reduce)').matches;
function paint(l,a,x,y,progress){let c=el('cv').getContext('2d');c.clearRect(0,0,800,480);for(let yy=0;yy<6;yy++)for(let xx=0;xx<10;xx++){let t=tile(l,xx,yy),u=xx*80,v=yy*80;c.fillStyle=({'#':'#26384e',P:'#50386d',G:'#164f49',H:openDoor(l,a)?'#245347':'#846222',T:'#685327','^':'#174d76','v':'#174d76','<':'#174d76','>':'#174d76'})[t]||'#111e30';c.fillRect(u+2,v+2,76,76);if(t==='#'||t==='P'){c.strokeStyle=t==='P'?'#b18ae8':'#405973';c.strokeRect(u+5,v+5,70,70)}if(t==='G'){c.strokeStyle='#72f0c0';c.lineWidth=3;c.strokeRect(u+18,v+18,44,44)}}for(let yy=0;yy<6;yy++)for(let xx=0;xx<10;xx++){let t=tile(l,xx,yy);if('TH^v<>'.includes(t)){c.fillStyle='#f1dca0';c.font='28px system-ui';c.fillText(({T:'◎',H:openDoor(l,a)?'○':'▣','^':'↑',v:'↓','<':'←','>':'→'})[t],xx*80+25,yy*80+48)}}for(let [bx,by] of a.boxes){c.fillStyle='#e2ae52';c.fillRect(bx*80+15,by*80+15,50,50);c.strokeStyle='#fff0b5';c.strokeRect(bx*80+20,by*80+20,40,40)}let px=x*80+40,py=y*80+40;c.save();if(a.f){c.strokeStyle='#6cdfff';c.lineWidth=2;c.beginPath();c.arc(px,py,32,0,Math.PI*2);c.stroke()}c.shadowColor=a.p?'#ba8aff':'#8edfff';c.shadowBlur=16;c.fillStyle=a.p?'#b68cff80':'#d8f4ff';c.beginPath();c.arc(px,py,22,0,Math.PI*2);c.fill();c.strokeStyle='#e0f5ff';c.lineWidth=2;c.stroke();c.restore();c.fillStyle='#b4ccef';c.font='24px system-ui';c.fillText(N[a.g],18,34)}
function draw(){showProfile();let l=L[i];let from=visual&&visual.i===i?visual:{x:s.x,y:s.y};let a={...s};visual={...a,i};if(frame)cancelAnimationFrame(frame);let start=performance.now();function tick(now){let t=reduced?1:Math.min(1,(now-start)/180);let q=1-(1-t)**3;paint(l,a,from.x+(a.x-from.x)*q,from.y+(a.y-from.y)*q,t);if(t<1)frame=requestAnimationFrame(tick)}tick(start);el('cv').classList.toggle('victory',won(l,s));el('hud').replaceChildren(...['全局 '+N[s.g]+' / 局部 '+N[gravity(l,s)],s.p?'虚体':'实体',...(l.laws?.length?[(laws(l,s).phase??s.p)?'允许穿透':'禁止穿透']:[]),s.f?'时间冻结':'时间流动','预算 '+s.b+'/'+l.budget].map(v=>{let n=document.createElement('span');n.textContent=v;return n}));let $=id=>document.getElementById(id);$('levels').value=i;$('title').textContent=l.name;$('desc').textContent=l.desc+(l.laws?.length?' · '+l.laws.map(describeLaw).join('；'):'');$('metrics').textContent=l.metrics?(l.metrics.grammar?'语法 '+l.metrics.grammar+' · 最短 '+l.metrics.steps+' 步 · 必需法则 '+l.metrics.required.join('/')+' · 可达状态 '+l.metrics.states+' · 最短解 '+l.metrics.paths+' 条 · 核心机制 '+l.metrics.mechanisms.join(' / ')+' · 种子 '+l.metrics.seed:'最短 '+l.metrics.steps+' 步 · 必需法则 '+l.metrics.required.length+' 种 · 首步死路 '+l.metrics.traps+' 条 · 种子 '+l.metrics.seed+(l.metrics.score?' · 最短解路径 '+l.metrics.paths+' 条 · 适应度 '+l.metrics.score.toFixed(2)+'（初始 '+l.metrics.baseline.toFixed(2)+'）':'')):'';$('msg').textContent=(won(l,s)?'通关成功！ · ':'')+'剩余预算 '+s.b+' / '+l.budget+' · 已行动 '+h.length;document.querySelectorAll('.movement button').forEach((b,j)=>{if(j<4)b.disabled=!step(l,s,{m:[1,2,0,3][j]});if(j===7)b.disabled=!won(l,s)||i>=L.length-1});$('rules').replaceChildren(...A.filter(t=>!('m'in t)&&l.allow.includes(Object.keys(t)[0])).map(t=>{let b=document.createElement('button');b.textContent='g'in t?'重力 '+N[t.g]:'p'in t?'物质：'+(s.p?'虚体':'实体'):'时间：'+(s.f?'冻结':'流动');b.className=('g'in t?s.g===t.g:'p'in t?s.p:s.f)?'on':'';b.disabled=!step(l,s,t);b.onclick=()=>apply(t);return b}))}if(typeof document!=='undefined'){let sel=document.getElementById('levels');L.forEach((l,j)=>sel.add(new Option(l.name,j)));sel.onchange=()=>{i=+sel.value;reset()};document.addEventListener('keydown',e=>{let m=['ArrowDown','ArrowLeft','ArrowUp','ArrowRight'].indexOf(e.key);if(m>=0&&!['SELECT','INPUT','TEXTAREA'].includes(e.target.tagName)){e.preventDefault();apply({m})}});reset();editorLoad(L[3])}
